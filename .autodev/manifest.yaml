version: 2

project:
  name: replace-me
  type: application

driver:
  runtime: ".autodev/runtime.yaml"

state:
  progress: ".autodev/state/progress.json"
  decisions: ".autodev/state/decisions.md"
  evidence_dir: ".autodev/evidence"
  brief: "PRODUCT_BRIEF.md"

git:
  automatic_commit: true
  forbidden:
    - ".env*"
    - "*.pem"
    - "*.key"
    - "*.pfx"
    - "secrets.*"
  protected:
    - ".autodev/policies/**"
    - ".autodev/manifest.yaml"
  max_changed_files: 50

autonomy:
  level: high

  allowed:
    - create_files
    - modify_code
    - modify_tests
    - update_documentation
    - initialize_scaffold
    - configure_runtime_driver

  allowed_with_validation:
    - add_dependency
    - change_public_api
    - modify_database_schema

  requires_human:
    - destructive_database_change
    - production_deployment
    - rotate_credentials
    - change_authorization_policy
    - modify_protected_governance_files

capabilities:
  database:
    available: false
  authentication:
    available: false
  file_storage:
    available: false
  async_jobs:
    available: false
  external_http:
    available: true
  browser_ui:
    available: false

contracts:
  bootstrap: ".autodev/commands/bootstrap"
  plan: ".autodev/commands/plan"
  cycle: ".autodev/commands/auto-cycle"
  inspect: ".autodev/commands/inspect"
  validate: ".autodev/commands/validate"
  test: ".autodev/commands/test"
  build: ".autodev/commands/build"
  verify: ".autodev/commands/verify"
  run: ".autodev/commands/run"
  preview: ".autodev/commands/deploy-preview"

definition_of_done:
  - specification_acceptance_criteria_defined
  - implementation_complete
  - validation_pass
  - tests_pass
  - build_pass
  - verify_pass
  - evidence_recorded
  - git_safety_pass
  - atomic_commit_created
  - documentation_updated
